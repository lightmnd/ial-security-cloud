version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestionale-db
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme_in_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gestionale"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gestionale-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@corso.local
      PGADMIN_DEFAULT_PASSWORD: changeme_in_production
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
