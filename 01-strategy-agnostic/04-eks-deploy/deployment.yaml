apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestionale-app-deployment
  labels:
    app: gestionale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestionale
  # Aggiornamento senza downtime: avvia 1 Pod nuovo prima di rimuovere i vecchi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gestionale
    spec:
      containers:
      - name: gestionale-container
        # IMPORTANTE: sostituire <ACCOUNT_ID> con l'ID del proprio account AWS.
        # Non applicare questo file direttamente — usare il comando sed dello Step 3:
        #   ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        #   sed "s/<ACCOUNT_ID>/$ACCOUNT_ID/g" deployment.yaml | kubectl apply -f -
        image: <ACCOUNT_ID>.dkr.ecr.eu-west-1.amazonaws.com/gestionale-app:1.0
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "AWS-EKS"
        # SOSTENIBILITÀ: Limiti rigidi per evitare sprechi di risorse cloud
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        # K8s aspetta che l'app sia pronta prima di inviare traffico
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        # K8s riavvia il container se smette di rispondere
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gestionale-app-service
spec:
  type: LoadBalancer
  selector:
    app: gestionale
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080